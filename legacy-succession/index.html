<style>
  :root{ --bg:#0E0A04; --accent:#C98F23; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:var(--bg); overflow:hidden; font-family:Inter,-apple-system,system-ui,sans-serif; }
  .deck{ height:100dvh; overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; }
  .slide{ position:relative; min-height:100dvh; scroll-snap-align:start; scroll-snap-stop:always;
          display:flex; align-items:center; justify-content:center; padding:min(4vh,40px) min(4vw,48px); }
  .slide img{ width:min(1440px,96vw); height:auto; max-height:92dvh; object-fit:contain;
              border-radius:7px; box-shadow:0 40px 100px -45px rgba(0,0,0,.75); }
  .actions{ position:fixed; top:18px; right:18px; z-index:30; display:flex; gap:10px; }
  .btn{ display:inline-flex; align-items:center; gap:9px; padding:12px 20px 12px 16px; border-radius:999px;
        text-decoration:none; font-size:13px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
        -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
        transition:color .2s, background .2s, border-color .2s, filter .2s, transform .2s; }
  .btn svg{ width:16px; height:16px; }
  .dl{ color:rgba(255,255,255,.82); background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); }
  .dl:hover{ color:#fff; background:var(--accent); border-color:var(--accent); }
  .inv{ color:#fff; background:var(--accent); border:1px solid var(--accent); box-shadow:0 8px 22px -8px rgba(201,143,35,.7); }
  .inv:hover{ filter:brightness(1.09); transform:translateY(-1px); }
  @media (max-width:560px){ .actions{ top:12px; right:12px; gap:8px; } .btn{ padding:10px 15px 10px 12px; font-size:11px; letter-spacing:1px; } .btn svg{ width:14px; height:14px; } }
  .cue{ position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
        color:var(--accent); font-size:24px; line-height:1; opacity:.85; animation:bob 1.9s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translate(-50%,0); } 50%{ transform:translate(-50%,7px); } }
  @media print{ .cue,.actions{ display:none; } .deck{ overflow:visible; height:auto; } }
</style></head>

<script>
(function(){try{
  if(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1') return;
  var LS=window.localStorage, p=new URLSearchParams(location.search);
  if(p.has('me')) LS.setItem('sl_owner', p.get('me')==='0'?'':'1');
  var owner=LS.getItem('sl_owner')==='1';
  var vid=LS.getItem('sl_vid');
  if(!vid){vid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random();LS.setItem('sl_vid',vid);}
  var slug=location.pathname.replace(/^\/+|\/+$/g,'').split('/')[0]||'root';
  var body=JSON.stringify({slug:slug,vid:vid,owner:owner,title:document.title||null,ref:document.referrer||null,url:location.href,path:location.pathname});
  var url='https://holden.storylinecreative.co/api/track';
  if(navigator.sendBeacon){navigator.sendBeacon(url,new Blob([body],{type:'text/plain'}));}
  else{fetch(url,{method:'POST',body:body,keepalive:true,mode:'no-cors'});}
}catch(e){}})();
